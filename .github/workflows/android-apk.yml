name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/native-mobile-runtime
    paths:
      - 'mobile/android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

env:
  ANDROID_DIR: mobile/android
  GRADLE_VERSION: '8.11.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK CLI
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Clean build debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK exists
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniRoute-Android-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-preview-${GITHUB_SHA::12}"
          gh release create "$TAG" \
            mobile/android/app/build/outputs/apk/debug/app-debug.apk#OmniRoute-Android-preview.apk \
            --target "$GITHUB_SHA" \
            --title "OmniRoute Android Preview ${GITHUB_SHA::12}" \
            --prerelease \
            --generate-notes
